<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial={
 users:[{id:'U-1001',name:'John Doe',email:'john@example.com',status:'Active',ref:'FR-1001',referredBy:'—'},{id:'U-1002',name:'Mary Smith',email:'mary@example.com',status:'Active',ref:'FR-1002',referredBy:'John Doe'},{id:'U-1003',name:'David Wilson',email:'david@example.com',status:'Deactivated',ref:'FR-1003',referredBy:'John Doe'},{id:'U-1004',name:'Sarah Brown',email:'sarah@example.com',status:'Active',ref:'FR-1004',referredBy:'Mary Smith'}],
 deposits:[{id:'D-1001',user:'John Doe',email:'john@example.com',amount:250,currency:'BTC',network:'Bitcoin',reference:'TXN123456',status:'Pending',date:'Just now'},{id:'D-1002',user:'Mary Smith',email:'mary@example.com',amount:100,currency:'ETH',network:'Ethereum',reference:'TXN789012',status:'Pending',date:'Today'},{id:'D-1003',user:'Sarah Brown',email:'sarah@example.com',amount:500,currency:'USDT',network:'TRC20',reference:'TXN445566',status:'Approved',date:'Yesterday'}],
 withdrawals:[{id:'W-1001',user:'David Wilson',email:'david@example.com',amount:120,currency:'USDT',network:'TRC20',address:'TQ9f2mL8vK5xExampleWalletAddress',status:'Pending',date:'Just now'},{id:'W-1002',user:'Mary Smith',email:'mary@example.com',amount:80,currency:'ETH',network:'Ethereum',address:'0xA9aExampleEthereumWalletAddress',status:'Pending',date:'Today'}],
 plans:[{id:'basic',name:'Basic Plan',min:50,max:100,rate:20,duration:24,unit:'hours',active:true},{id:'plan2',name:'Plan 2',min:100,max:499,rate:50,duration:42,unit:'hours',active:true},{id:'plan3',name:'Plan 3',min:500,max:4999,rate:100,duration:168,unit:'hours',active:true},{id:'bot',name:'Bot Trading',min:100,max:300,rate:30,duration:30,unit:'days',active:true},{id:'aurum',name:'Aurum',min:5000,max:350000,rate:200,duration:30,unit:'days',active:true}],
 investments:[{id:'I-1001',user:'John Doe',plan:'Basic Plan',amount:100,profit:20,started:Date.now()-1000*60*60*4,durationHours:24,status:'Active'},{id:'I-1002',user:'Mary Smith',plan:'Plan 2',amount:250,profit:125,started:Date.now()-1000*60*60*18,durationHours:42,status:'Active'},{id:'I-1003',user:'Sarah Brown',plan:'Plan 3',amount:1000,profit:1000,started:Date.now()-1000*60*60*168,durationHours:168,status:'Completed'}],
 wallets:[{asset:'Bitcoin',symbol:'BTC',network:'Bitcoin',address:'bc1q-example-wallet-address',active:true},{asset:'Ethereum',symbol:'ETH',network:'Ethereum',address:'0x-example-wallet-address',active:true},{asset:'Tether',symbol:'USDT',network:'TRC20',address:'TQ-example-wallet-address',active:true},{asset:'Litecoin',symbol:'LTC',network:'Litecoin',address:'ltc1q-example-wallet-address',active:true}],
 notifications:[{id:'N-1001',title:'New user registration',message:'John Doe created an account.',target:'All users',date:new Date().toISOString(),read:false},{id:'N-1002',title:'Deposit request received',message:'John Doe submitted a $250 BTC deposit.',target:'Admin',date:new Date().toISOString(),read:false},{id:'N-1003',title:'Withdrawal request received',message:'David Wilson requested a $120 withdrawal.',target:'Admin',date:new Date().toISOString(),read:false}],
 settings:{email:'adminfinrise@finrise.com',password:'adminfinrise',name:'Administrator'}
};
let db;try{db=JSON.parse(localStorage.getItem('finriseAdminDemoData'))||structuredClone(initial)}catch(e){db=JSON.parse(JSON.stringify(initial))}
// Fill optional profile fields for older local demo records without overwriting existing values.
db.users.forEach((u,i)=>{u.username=u.username||u.name.toLowerCase().replace(/[^a-z0-9]+/g,'');u.country=u.country||['Nigeria','Ghana','United Kingdom','Kenya'][i%4];u.registeredAt=u.registeredAt||new Date(Date.now()-(i+2)*86400000).toISOString();u.lastSeen=u.lastSeen||(i===0?'Just now':new Date(Date.now()-(i+1)*3600000).toISOString());u.online=typeof u.online==='boolean'?u.online:i===0;u.balance=Number.isFinite(Number(u.balance))?Number(u.balance):[1250,420,75,830][i%4];u.username=u.username||('user'+(i+1))});
db.investments.forEach(i=>{const u=db.users.find(u=>u.name===i.user);i.email=i.email||(u?u.email:'');});
let page='dashboard',refreshing=false,coins=[],toastTimer;
function save(){localStorage.setItem('finriseAdminDemoData',JSON.stringify(db))}
function toast(s){$('#toastRoot').innerHTML=`<div class="toast">✓ &nbsp;${esc(s)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toastRoot').innerHTML='',3200)}
function unread(){return db.notifications.filter(n=>!n.read).length}
function pending(arr){return arr.filter(x=>x.status==='Pending').length}
function topCounts(){const n=unread();$('#topCount').textContent=n;$('#topCount').classList.toggle('hidden',!n);$('#notificationButton').classList.toggle('has-unread',n>0);$('#sideNoticeCount').textContent=n||'';$('#depositCount').textContent=pending(db.deposits)||'';$('#withdrawalCount').textContent=pending(db.withdrawals)||''}
function moneySum(arr,status){return arr.filter(x=>!status||x.status===status).reduce((a,x)=>a+Number(x.amount||0),0)}
function go(p){page=p;$$('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();if(innerWidth<720)$('#sidebar').classList.add('closed')}
function heading(title,sub){return `<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><span class="live-pill">Admin workspace</span></div>`}
function metric(title,value,icon,sub='Updated from current dashboard data'){return `<div class="metric"><div class="metric-top"><span>${title}</span><span class="metric-icon">${icon}</span></div><strong>${value}</strong><small>${sub}</small></div>`}
function table(headers,rows,empty='No records found'){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function status(s){return `<span class="status ${String(s).toLowerCase()}">${esc(s)}</span>`}
function animateMetricNumbers(){const nodes=$$('.metric strong');nodes.forEach(el=>{if(el.dataset.counted)return;el.dataset.counted='1';const original=el.textContent.trim();const match=original.match(/^([^0-9-]*)([0-9,]+(?:\.[0-9]+)?)(.*)$/);if(!match)return;const prefix=match[1],target=Number(match[2].replace(/,/g,'')),suffix=match[3];if(!Number.isFinite(target)||target<=0)return;const start=performance.now(),duration=1000;let lastStep=-1;function tick(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3),v=target*ease,step=Math.floor(t*12);el.textContent=prefix+(Number.isInteger(target)?Math.floor(v).toLocaleString():v.toLocaleString(undefined,{maximumFractionDigits:2}))+suffix;if(step!==lastStep&&step<12){lastStep=step;try{if(window.AudioContext||window.webkitAudioContext){const C=window.AudioContext||window.webkitAudioContext;window.__finriseAudio=window.__finriseAudio||new C();const ctx=window.__finriseAudio;if(ctx.state==='running'){const now=ctx.currentTime;[[step%2?659.25:523.25,0],[783.99,.045]].forEach(([hz,delay])=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(hz,now+delay);gain.gain.setValueAtTime(.0001,now+delay);gain.gain.exponentialRampToValueAtTime(.012,now+delay+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.095);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+delay);osc.stop(now+delay+.1)})}}}catch(_){}}if(t<1)requestAnimationFrame(tick);else el.textContent=original}requestAnimationFrame(tick)})}
function render(){topCounts();let html='';
if(page==='dashboard'){
let approved=moneySum(db.deposits,'Approved'),withdrawn=moneySum(db.withdrawals,'Approved');
html=heading('Dashboard','A live overview of your FINRISE ASSETS activity.');
html+=`<div class="grid metrics">${metric('Total users',db.users.length,'♙')}${metric('Deactivated users',db.users.filter(u=>u.status==='Deactivated').length,'⊘')}${metric('Total deposited',fmt(approved),'＄','Approved deposits')}${metric('Total withdrawal',fmt(withdrawn),'⇧','Approved withdrawals')}${metric('Total deposit requests',db.deposits.length,'⇩','All deposit records')}${metric('Pending deposits',pending(db.deposits),'◷','Awaiting review')}${metric('Pending withdrawals',pending(db.withdrawals),'◷','Awaiting review')}${metric('Active investments',db.investments.filter(i=>i.status==='Active').length,'◴','Currently in progress')}</div>`;
html+=`<div class="grid two-col"><section class="panel"><div class="panel-head"><h2>Live crypto market prices</h2><span class="tiny muted" id="marketUpdated">CoinGecko · loading</span></div><div id="marketGrid" class="market-grid">${[1,2,3,4,5,6].map(()=>`<div class="coin"><div class="muted">Loading market…</div></div>`).join('')}</div><p class="tiny muted" style="margin:13px 0 0">Market data is fetched from CoinGecko when the network is available.</p></section><section class="panel"><div class="panel-head"><h2>Recent activity</h2><button class="secondary" onclick="go('notifications')">View all →</button></div><div>${db.notifications.slice().reverse().slice(0,1).map(n=>`<div class="note-item"><span class="note-dot" style="background:${n.read?'#54728f':'#ff4266'}"></span><div><strong>${esc(n.title)}</strong><p>${esc(n.message)}</p><small>${new Date(n.date).toLocaleString()}</small></div></div>`).join('')||'<div class="empty">No recent activity</div>'}</div></section></div>`;
}else if(page==='deposits'){
html=heading('Deposit management','Review user deposit requests and approve or reject each request.');
const rows=db.deposits.filter(d=>d.status==='Pending').map(d=>`<tr><td>${esc(d.id)}</td><td><b>${esc(d.user)}</b><br><span class="muted">${esc(d.email)}</span></td><td>${fmt(d.amount)}</td><td>${esc(d.currency)}</td><td>${esc(d.network)}</td><td>${esc(d.reference)}</td><td>${status(d.status)}</td><td>${d.status==='Pending'?`<div class="actions"><button class="success" onclick="review('deposits','${d.id}','Approved')">Approve</button><button class="danger" onclick="review('deposits','${d.id}','Rejected')">Reject</button></div>`:'—'}</td></tr>`).join('');
html+=`<section class="panel"><div class="panel-head"><h2>Deposit requests (${db.deposits.length})</h2><span class="status pending">${pending(db.deposits)} pending</span></div>${table(['Request ID','User','Amount','Asset','Network','Reference','Status','Action'],rows||'')}</section>`;
}else if(page==='withdrawals'){
html=heading('Withdrawal management','Review requests, inspect destination wallets and copy addresses.');
const rows=db.withdrawals.filter(w=>w.status==='Pending').map(w=>`<tr><td>${esc(w.id)}</td><td><b>${esc(w.user)}</b><br><span class="muted">${esc(w.email)}</span></td><td>${fmt(w.amount)}</td><td>${esc(w.currency)}</td><td>${esc(w.network)}</td><td style="max-width:210px;white-space:normal;overflow-wrap:anywhere">${esc(w.address)}<br><button class="copy" onclick="copyText('${esc(w.address).replace(/'/g,"\\'")}')">▣ Copy address</button></td><td>${status(w.status)}</td><td>${w.status==='Pending'?`<div class="actions"><button class="success" onclick="review('withdrawals','${w.id}','Approved')">Approve</button><button class="danger" onclick="review('withdrawals','${w.id}','Rejected')">Reject</button></div>`:'—'}</td></tr>`).join('');
html+=`<section class="panel"><div class="panel-head"><h2>Withdrawal requests (${db.withdrawals.length})</h2><span class="status pending">${pending(db.withdrawals)} pending</span></div>${table(['Request ID','User','Amount','Asset','Network','Destination wallet','Status','Action'],rows)}</section>`;
}else if(page==='users'){
html=heading('User management','Review registered profiles, account status, activity and balances.');
html+=`<section class="panel"><div class="panel-head"><div><h2>Registered users</h2><p class="tiny muted">${db.users.length} profiles in this local prototype</p></div><input id="userSearch" class="search-input" placeholder="Search name, email or username…" aria-label="Search users"></div><div id="usersTable">${usersTableHtml()}</div><p class="tiny muted" style="margin-top:12px">Online and last-seen values are sample browser data here. Live account data requires Supabase integration.</p></section>`;
}else if(page==='referrals'){
html=heading('Referral tree','Choose any registered user to explore their upliner and downliner connections.');
html+=`<section class="panel"><div class="panel-head"><h2>Registered users</h2><span class="tiny muted">${db.users.length} users</span></div>${table(['User','Email','Referral code','Upliner','Referral tree'],db.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><small class="muted">@${esc(u.username)}</small></td><td>${esc(u.email)}</td><td>${esc(u.ref||'—')}</td><td>${esc(u.referredBy||'—')}</td><td><button class="secondary tree-open" onclick="openReferralTree('${u.id}')">⌄ View upliner / downliner</button></td></tr>`).join(''))}<p class="tiny muted">Referral links use the currently available prototype records; connect Supabase for live relationships.</p></section>`;
}else if(page==='plans'){
html=heading('Investment plan editor','Edit plan details and availability. Changes are stored in this browser prototype.');
html+=`<div class="grid plan-grid">${db.plans.map(p=>`<article class="plan-card"><div class="tiny muted">INVESTMENT PLAN</div><h3>${esc(p.name)}</h3><div class="rate">${p.rate}%</div><div class="muted tiny">Advertised return · configured plan value</div><div class="plan-line"><span>Minimum</span><b>${fmt(p.min)}</b></div><div class="plan-line"><span>Maximum</span><b>${fmt(p.max)}</b></div><div class="plan-line"><span>Duration</span><b>${p.duration} ${esc(p.unit)}</b></div><div class="plan-actions"><button class="secondary" onclick="editPlan('${p.id}')">✎ Edit plan</button><div style="display:flex;align-items:center;gap:7px"><small>${p.active?'Active':'Inactive'}</small><span class="switch ${p.active?'on':''}" onclick="togglePlan('${p.id}')"></span></div></div></article>`).join('')}</div>`;
}else if(page==='investments'){
html=heading('Active investments','Only investments still in progress are shown here. Completed investments automatically leave this view.');
const activeInvestments=db.investments.filter(i=>i.status==='Active'&&(i.maturesAt||i.started+i.durationHours*3600000)>Date.now()).sort((a,b)=>b.started-a.started);
html+=`<section class="panel"><div class="panel-head"><h2>Active investments</h2><span class="status active">${activeInvestments.length} active</span></div><div class="investment-list">${activeInvestments.length?activeInvestments.map(i=>{const maturity=i.maturesAt||i.started+i.durationHours*3600000,totalMs=Math.max(1,maturity-i.started),elapsed=Math.max(0,Date.now()-i.started),pct=Math.min(100,Math.floor(elapsed/totalMs*100)),remaining=Math.max(0,maturity-Date.now());return `<article class="investment-card" data-investment-id="${esc(i.id)}" data-start="${i.started}" data-duration="${totalMs}" data-maturity="${maturity}"><div class="investment-meta"><div style="min-width:0"><div class="investment-title">${esc(i.plan||'Investment')}</div><span class="investment-sub">${esc(i.username||i.user||'User')} · ${esc(i.email||'Email unavailable')}</span><span class="investment-sub">${esc(i.id)} · Principal ${fmt(i.amount)}</span></div><div class="investment-status-side"><span class="status active">Active</span><div class="investment-timer" data-countdown>${remaining>0?'Calculating…':'Due now'}</div><div class="tiny muted"><b data-percent>${pct}%</b> complete</div></div></div><div class="investment-progress"><span data-progress style="width:${pct}%"></span><i class="progress-glint"></i></div><div class="investment-foot"><span>Expected return: <b>${fmt(Number(i.amount)+Number(i.profit||0))}</b></span><span>Profit: ${fmt(i.profit)}</span><span>Verified completion date: <b>${new Date(maturity).toLocaleString()}</b></span></div></article>`}).join(''):'<div class="empty">No active investments.</div>'}</div></section>`;
}else if(page==='notifications'){
html=heading('Notifications','Review admin activity or send a message for the connected user dashboard.');
html+=`<div class="grid two-col"><section class="panel"><div class="panel-head"><h2>Send user notification</h2></div><form id="sendNotice"><div class="field"><label>Notification title</label><input name="title" required placeholder="e.g. Deposit approved"></div><div class="field"><label>Message</label><textarea name="message" rows="4" required placeholder="Write the notification message…"></textarea></div><div class="field"><label>Recipient</label><select name="target"><option>All users</option>${db.users.map(u=>`<option>${esc(u.email)}</option>`).join('')}</select></div><button class="primary">Send notification</button><p class="tiny muted">In this standalone prototype, messages are saved locally only; delivery to users requires the Supabase connection.</p></form></section><section class="panel"><div class="panel-head"><h2>Recent notifications</h2><button class="secondary" onclick="markAllRead()">Mark all read</button></div>${db.notifications.slice().reverse().map(n=>`<div class="note-item"><span class="note-dot" style="background:${n.read?'#b6b6b6':'#df3150'}"></span><div style="flex:1"><strong>${esc(n.title)}</strong><p>${esc(n.message)}</p><small>${esc(n.target)} · ${new Date(n.date).toLocaleString()}</small></div><div class="note-actions"><button class="secondary" onclick="markRead('${n.id}')">${n.read?'✓ Read':'Mark as read'}</button><button class="danger" onclick="deleteNotice('${n.id}',this)">Delete</button></div></div>`).join('')||'<div class="empty">No notifications yet.</div>'}</section></div>`;
}else if(page==='wallets'){
html=heading('Edit wallet addresses','Manage the addresses displayed on the user deposit page once connected to your backend.');
html+=`<section class="panel"><div class="panel-head"><h2>Deposit wallet addresses</h2><button class="primary" onclick="editWallet(-1)">＋ Add wallet</button></div>${db.wallets.map((w,i)=>`<div class="wallet-row"><div class="wallet-icon"><img class="crypto-real-logo" alt="${esc(w.symbol)} logo" src="${({BTC:'https://assets.coingecko.com/coins/images/1/large/bitcoin.png',ETH:'https://assets.coingecko.com/coins/images/279/large/ethereum.png',USDT:'https://assets.coingecko.com/coins/images/325/large/Tether.png',LTC:'https://assets.coingecko.com/coins/images/2/large/litecoin.png'})[w.symbol]||'https://assets.coingecko.com/coins/images/1/large/bitcoin.png'}"></div><div class="wallet-info"><strong>${esc(w.asset)} <span class="muted">(${esc(w.symbol)})</span></strong><small>${esc(w.network)} · ${esc(w.address)}</small></div><span class="status ${w.active?'active':'deactivated'}">${w.active?'Active':'Inactive'}</span><button class="secondary" onclick="editWallet(${i})">Edit</button></div>`).join('')}<p class="tiny muted">These are sample addresses, not payment instructions. Replace them with verified addresses before use.</p></section>`;

function openReferralTree(id){const selected=db.users.find(x=>x.id===id);if(!selected)return;const parent=u=>db.users.find(x=>x.name===u.referredBy);const ancestors=[];let cur=selected,guard=new Set();while(cur&&cur.referredBy&&cur.referredBy!=='—'&&!guard.has(cur.id)){guard.add(cur.id);const p=parent(cur);if(!p)break;ancestors.unshift(p);cur=p}const childrenOf=u=>db.users.filter(x=>x.referredBy===u.name);const shortName=u=>(String(u.name||'USR').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase()||'USR');const person=u=>`<div class="tree-person"><div class="mini-avatar">${esc(shortName(u))}</div><div style="min-width:0"><b>${esc(shortName(u))}</b><div class="tiny muted">${esc(u.ref||'Member node')}</div><div class="tiny muted">${childrenOf(u).length} downline${childrenOf(u).length===1?'':'s'}</div></div></div>`;function down(u,seen=new Set(),root=false){if(seen.has(u.id))return '';seen.add(u.id);const kids=childrenOf(u);return `<details class="tree-details" ${root?'open':''}><summary>${person(u)}</summary>${kids.length?`<div class="tree-branch">${kids.map(k=>down(k,new Set(seen))).join('')}</div>`:'<div class="tiny muted" style="padding:8px 12px">No downliners at this level</div>'}</details>`}const hasRelations=ancestors.length||childrenOf(selected).length;const tree=hasRelations?`<div class="tree-root-label">UPLINER CHAIN</div>${ancestors.map(person).join('<div style="text-align:center;color:#b18a2d;padding:3px">↓</div>')}<div style="text-align:center;color:#b18a2d;padding:3px">↓</div><div class="tree-root-label">SELECTED MEMBER</div>${down(selected,new Set(),true)}`:`<div class="empty" style="padding:28px 12px"><div style="font-size:28px;color:#b88a2b;margin-bottom:8px">◇</div><b>No referral records</b><div class="tiny muted" style="margin-top:4px">This member has no recorded upliner or downliners.</div></div>`;showModal('Referral network',`<div class="tree-legend"><span class="tree-legend-dot"></span>Expandable referral chain <span class="tiny muted" style="margin-left:auto">${hasRelations?'Relationships found':'No records'}</span></div><div class="tree-visual">${tree}</div><p class="tiny muted" style="margin-bottom:0">Names are shortened to initials for a cleaner, privacy-conscious view. Tap a node to expand or collapse its downliners.</p>`,`<button class="primary" onclick="closeModal()">Close tree</button>`)}

let notificationChannel=null, notificationJingleTimer=null, notificationAudio=null, unseenRealtimeNotice=false;
function stopNotificationJingle(){unseenRealtimeNotice=false;if(notificationJingleTimer){clearInterval(notificationJingleTimer);notificationJingleTimer=null;}const b=$id('notificationButton');if(b)b.classList.remove('notification-jingle');}
function playNotificationChime(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;notificationAudio=notificationAudio||new C();if(notificationAudio.state==='suspended')return;const t=notificationAudio.currentTime;[0,0.16].forEach((offset,index)=>{const osc=notificationAudio.createOscillator(),gain=notificationAudio.createGain();osc.type='sine';osc.frequency.value=index?1046:784;gain.gain.setValueAtTime(0.0001,t+offset);gain.gain.exponentialRampToValueAtTime(0.12,t+offset+0.015);gain.gain.exponentialRampToValueAtTime(0.0001,t+offset+0.24);osc.connect(gain);gain.connect(notificationAudio.destination);osc.start(t+offset);osc.stop(t+offset+0.25);});}catch(e){console.debug('Notification sound unavailable',e)}}
function startNotificationJingle(){unseenRealtimeNotice=true;const b=$id('notificationButton');if(b)b.classList.add('notification-jingle');if(notificationJingleTimer)return;playNotificationChime();notificationJingleTimer=setInterval(()=>{if(!unseenRealtimeNotice){stopNotificationJingle();return;}playNotificationChime();},3000);}
function subscribeAdminNotifications(){if(!sb||!admin)return;if(notificationChannel){sb.removeChannel(notificationChannel);notificationChannel=null;}notificationChannel=sb.channel('finrise-admin-notification-inserts').on('postgres_changes',{event:'INSERT',schema:'public',table:'user_notifications'},payload=>{const n=payload.new||{};db.notifications.unshift({id:n.id,title:n.title||'New notification',message:n.message||'',target:'User',date:n.created_at||new Date().toISOString(),read:!!n.is_read,userId:n.user_id});topCounts();if(page==='notifications'||page==='dashboard')render();startNotificationJingle();toast('New user notification received.');}).subscribe();}
async function showLiveApp(){await loadLiveData();subscribeAdminNotifications();$id('login').classList.add('hidden');$id('app').style.display='block';$id('adminName').textContent=admin?.email||'Administrator';const av=$id('headerAvatar');if(av)av.textContent=(admin?.email||'A').slice(0,1).toUpperCase();go('dashboard');loadMarket();}
async function signIn(e){e.preventDefault();e.stopImmediatePropagation();const b=$id('loginForm').querySelector('button[type=submit]');if(b)b.disabled=true;$id('loginError').textContent='Signing in…';try{const {data,error}=await sb.auth.signInWithPassword({email:$id('loginEmail').value.trim(),password:$id('loginPassword').value});if(error)throw error;await requireAdmin(data.session);await showLiveApp();$id('loginError').textContent='';}catch(x){$id('loginError').textContent=errMsg(x);console.error(x);}finally{if(b)b.disabled=false;}}
async function boot(){try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session){await requireAdmin(data.session);await showLiveApp();}else{$id('app').style.display='none';$id('login').classList.remove('hidden');}}catch(e){console.error('Admin startup',e);try{await sb.auth.signOut()}catch(_){}$id('app').style.display='none';$id('login').classList.remove('hidden');$id('loginError').textContent=errMsg(e);}}
function logout(e){if(e)e.stopImmediatePropagation();stopNotificationJingle();if(notificationChannel){sb.removeChannel(notificationChannel);notificationChannel=null;}sb.auth.signOut().finally(()=>{admin=null;$id('app').style.display='none';$id('login').classList.remove('hidden');$id('loginPassword').value='';$id('loginError').textContent='';});}
window.logoutFinriseAdmin=logout;

window.review=function(collection,id,next){const item=db[collection]?.find(x=>x.id===id);if(!item||item.status!=='Pending'){toast('This request is no longer pending. Refreshing records…');refreshFinriseAdmin();return;}const kind=collection==='deposits'?'deposit':'withdrawal';const warn=kind==='withdrawal'&&next==='Approved'?'Approval records the decision only; it does not transfer cryptocurrency.':'The secure Supabase review function updates the request and applies its configured balance/ledger rules.';showModal(`Confirm ${next.toLowerCase()}`,`<p>Are you sure you want to ${next.toLowerCase()} request <b>${esc(id)}</b>?</p><p class="muted tiny">${warn}</p>`,`<button class="secondary" onclick="closeModal()">Cancel</button><button id="confirmReviewButton" class="${next==='Approved'?'success':'danger'}" onclick="applyReview('${collection}','${id}','${next}')">Confirm ${next}</button>`);};
window.applyReview=async function(collection,id,next){const key=collection+':'+id;if(busyReviews.has(key))return;busyReviews.add(key);const b=$id('confirmReviewButton');if(b){b.disabled=true;b.textContent='Processing…'}const kind=collection==='deposits'?'deposit':'withdrawal',table=kind==='deposit'?'deposit_requests':'withdrawal_requests';try{
 const check=await sb.from(table).select('status').eq('id',id).maybeSingle();if(check.error)throw check.error;if(!check.data)throw Error('Request not found. Refresh the page.');if(String(check.data.status).toLowerCase()!=='pending'){closeModal();await loadLiveData();render();toast('This request was already reviewed. The latest status has been loaded.');return;}
 const {error}=await sb.rpc('finrise_admin_review_request',{p_kind:kind,p_request_id:id,p_decision:next.toLowerCase()});if(error)throw error;
 let noticeWarning='';const item=db[collection].find(x=>x.id===id);if(item?.email){const n=await sb.rpc('finrise_admin_send_notification',{p_recipient_email:item.email,p_title:`${kind==='deposit'?'Deposit':'Withdrawal'} ${next.toLowerCase()}`,p_message:`Your ${kind} request for ${fmt(item.amount)} has been ${next.toLowerCase()}.`});if(n.error)noticeWarning=' The request was updated, but the user notification could not be sent: '+errMsg(n.error);}
 closeModal();await loadLiveData();render();toast(`${kind} ${next.toLowerCase()} successfully.${noticeWarning}`);
 }catch(e){try{await loadLiveData();render();const current=db[collection]?.find(x=>x.id===id);if(/already reviewed|already been reviewed/i.test(errMsg(e))&&current&&current.status!=='Pending'){closeModal();toast(`This request was already processed. Current status: ${current.status}.`);}else fail(e);}catch(_){fail(e)}}finally{busyReviews.delete(key);}};
window.editPlan=function(id){const p=id?db.plans.find(x=>x.id===id):{name:'',description:'',min:50,max:null,rate:0,duration:24,unit:'hours',active:true};if(id&&!p)return;showModal(id?'Edit investment plan':'Create investment plan',`<form id="editPlanForm"><div class="field"><label>Plan name</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>Description</label><textarea name="description" rows="2">${esc(p.description||'')}</textarea></div><div class="form-row"><div class="field"><label>Minimum (USD)</label><input name="min" type="number" min="0.01" step="0.01" value="${p.min}" required></div><div class="field"><label>Maximum (USD, optional)</label><input name="max" type="number" min="0" step="0.01" value="${p.max??''}"></div></div><div class="form-row"><div class="field"><label>Return (%)</label><input name="rate" type="number" min="0" step="0.01" value="${p.rate}" required></div><div class="field"><label>Duration</label><input name="duration" type="number" min="1" step="1" value="${p.duration}" required></div></div><div class="field"><label>Duration unit</label><select name="unit"><option value="hours" ${p.unit==='hours'?'selected':''}>hours</option><option value="days" ${p.unit==='days'?'selected':''}>days</option></select></div><label><input type="checkbox" name="active" ${p.active?'checked':''}> Plan available to users</label></form>`,`<button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="savePlan('${id||''}')">Save plan</button>`);};
window.savePlan=async function(id){const f=$id('editPlanForm');if(!f||!f.reportValidity())return;const d=new FormData(f),unit=d.get('unit'),duration=Number(d.get('duration'));const payload={name:String(d.get('name')).trim(),description:String(d.get('description')||''),min_amount:Number(d.get('min')),max_amount:d.get('max')===''?null:Number(d.get('max')),return_rate:Number(d.get('rate')),duration_days:unit==='days'?duration:Math.max(1,Math.ceil(duration/24)),duration_hours:unit==='hours'?duration:null,is_active:f.elements.active.checked,updated_at:new Date().toISOString()};if(payload.max_amount!==null&&payload.max_amount<payload.min_amount)return toast('Maximum must be greater than or equal to minimum.');try{const q=id?sb.from('investment_plans').update(payload).eq('id',id):sb.from('investment_plans').insert(payload);const {error}=await q;if(error)throw error;closeModal();await loadLiveData();go('plans');toast(id?'Investment plan updated.':'Investment plan created.')}catch(e){fail(e)}};
window.togglePlan=async function(id){const p=db.plans.find(x=>x.id===id);if(!p)return;try{const {error}=await sb.from('investment_plans').update({is_active:!p.active,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;await loadLiveData();render();toast('Investment plan status updated.')}catch(e){fail(e)}};
window.editWallet=function(i){const w=i<0?{asset:'',symbol:'',network:'',address:'',active:true}:db.wallets[i];showModal(i<0?'Add deposit wallet':'Edit wallet address',`<form id="walletForm"><div class="form-row"><div class="field"><label>Asset name</label><input name="asset" value="${esc(w.asset)}" required></div><div class="field"><label>Asset code</label><input name="symbol" value="${esc(w.symbol)}" required></div></div><div class="field"><label>Network</label><input name="network" value="${esc(w.network)}" required></div><div class="field"><label>Wallet address</label><textarea name="address" rows="3" required>${esc(w.address)}</textarea></div><label><input type="checkbox" name="active" ${w.active?'checked':''}> Active for deposits</label></form>`,`<button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveWallet(${i})">Save wallet</button>`)};
window.saveWallet=async function(i){const f=$id('walletForm');if(!f||!f.reportValidity())return;const d=new FormData(f),payload={asset_code:String(d.get('symbol')).trim().toUpperCase(),asset_name:String(d.get('asset')).trim(),network_name:String(d.get('network')).trim(),wallet_address:String(d.get('address')).trim(),is_active:f.elements.active.checked,updated_at:new Date().toISOString()};try{let q;if(i<0)q=sb.from('finrise_deposit_wallets').insert(payload);else{const w=db.wallets[i];q=sb.from('finrise_deposit_wallets').update(payload).eq('asset_code',w.asset_code).eq('network_name',w.network)}const {error}=await q;if(error)throw error;closeModal();await loadLiveData();go('wallets');toast('Deposit wallet saved.')}catch(e){fail(e)}};
// Real balance credit: the RPC updates user_balances and its ledger on the server.
window.submitAddFunds=async function(id){const f=$id('addFundsForm');if(!f||!f.reportValidity())return;const u=db.users.find(x=>x.id===id);if(!u)return;const d=new FormData(f),amount=Number(d.get('amount')),reason=String(d.get('reference')||'Administrator balance adjustment').trim();if(!Number.isFinite(amount)||amount<=0)return toast('Enter a valid amount.');if(!u.email)return toast('This user has no email address on their profile.');if(busyCredits.has(id))return;busyCredits.add(id);const btn=f.parentElement?.querySelector('button.primary');if(btn){btn.disabled=true;btn.textContent='Adding…'}try{const {data,error}=await sb.rpc('finrise_admin_credit_balance',{p_email:u.email,p_amount:amount,p_reason:reason||'Administrator balance adjustment'});if(error)throw error;closeModal();await loadLiveData();render();toast(`$${amount.toFixed(2)} added to ${u.email}'s live balance.`)}catch(e){fail(e)}finally{busyCredits.delete(id)}};

function bindNotice(){const f=$id('sendNotice');if(!f)return;f.addEventListener('submit',async e=>{e.preventDefault();e.stopImmediatePropagation();const d=new FormData(f),recipient=String(d.get('target')||'All users'),titleText=String(d.get('title')||'').trim(),message=String(d.get('message')||'').trim(),b=f.querySelector('button[type=submit],button:not([type])');if(!titleText||!message)return toast('Enter a notification title and message.');if(b){b.disabled=true;b.textContent='Sending…'}try{const {data,error}=await sb.rpc('finrise_admin_send_notification',{p_recipient_email:recipient==='All users'?null:recipient,p_title:titleText,p_message:message});if(error)throw error;const count=Number(data||0);if(count<1)throw Error('No matching registered user was found.');await loadLiveData();render();toast(`Notification sent to ${count} user(s).`)}catch(e){fail(e)}finally{if(b){b.disabled=false;b.textContent='Send notification'}}},true);}
const baseRender=window.render;window.render=function(){baseRender();if(page==='users'){const host=$id('mainContent');if(host){const deactivated=db.users.filter(u=>u.status==='Deactivated');const body=deactivated.map(u=>`<tr><td><b>${esc(u.name||u.username||'User')}</b></td><td>${esc(u.email||'—')}</td><td>@${esc(u.username||'—')}</td><td>${esc(date(u.registeredAt))}</td><td><button class="primary" style="padding:7px 11px;font-size:11px" onclick="reactivateUser('${esc(u.id)}')">Reactivate</button></td></tr>`).join('');host.insertAdjacentHTML('beforeend',`<section class="panel" id="deactivatedUsersPanel"><div class="panel-head"><div><h2>Deactivated users</h2><p class="tiny muted">Accounts deactivated from the user dashboard</p></div><span class="status deactivated">${deactivated.length} deactivated</span></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Username</th><th>Registration date</th><th>Action</th></tr></thead><tbody>${body||'<tr><td colspan="5" class="empty">No deactivated users.</td></tr>'}</tbody></table></div></section>`);}}if(page==='referrals'){const sponsors=new Map(db.users.filter(u=>u.ref).map(u=>[String(u.ref).trim().toLowerCase(),u]));const list=db.users.map(referred=>{const sponsor=sponsors.get(String(referred.referredBy||'').trim().toLowerCase());return `<tr><td><b>${esc(sponsor?.username||'—')}</b><br><small class="muted">${esc(sponsor?.email||'Email unavailable')}</small></td><td><b>${esc(referred.username||referred.name)}</b><br><small class="muted">${esc(referred.email||'Email unavailable')}</small></td><td>${esc(date(referred.registeredAt))}</td></tr>`}).join('');$id('mainContent').innerHTML=`<div class="page-head"><div><h1>Referral registrations</h1><p>Real referral relationships from registered FINRISE user profiles.</p></div></div><section class="panel"><div class="panel-head"><h2>Referral records</h2><span class="tiny muted">${db.users.length} registered users</span></div><div class="table-wrap"><table><thead><tr><th>Sponsor</th><th>Referral</th><th>Registration date</th></tr></thead><tbody>${list||'<tr><td colspan="3" class="empty">No registered referrals found.</td></tr>'}</tbody></table></div></section>`;}if(page==='notifications'){const f=$id('sendNotice');if(f){const note=f.querySelector('p.tiny.muted');if(note)note.textContent='Messages are sent to the selected registered user(s) through Supabase.';bindNotice();}}if(page==='wallets'){const p=$id('mainContent')?.querySelector('p.tiny.muted');if(p)p.textContent='Wallet updates are saved to Supabase and reflected on the user deposit page.';}if(page==='users'){const p=$id('mainContent')?.querySelector('p.tiny.muted[style]');if(p)p.textContent='Live user profiles and USD balances loaded from Supabase.';}};
// Reactivation is confirmed first, then updates the actual FINRISE profile in Supabase.
