<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0b"><link rel="manifest" href="/admin/manifest.json"><link rel="apple-touch-icon" href="/admin/icons/icon-192.png"><title>Finrise Admin Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#2b2208,#050505 55%);color:#f8f5ea;font:15px Inter,Arial,sans-serif;padding:20px}.box{width:min(420px,100%);padding:30px;border:1px solid #6d5720;border-radius:18px;background:#0c0b08;box-shadow:0 20px 60px #0008}.logo{width:58px;height:58px;background:#D4AF37;color:#000;border-radius:15px;display:grid;place-items:center;font-size:34px;font-weight:900;margin-bottom:18px}.muted{color:#aaa18d;font-size:13px;line-height:1.5}label{display:block;font-size:12px;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #4e401b;background:#080806;color:white;border-radius:9px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#D4AF37;color:#080705;font-weight:800}#message{font-size:12px;color:#f2cf61;line-height:1.5;overflow-wrap:anywhere}</style></head><body><form class="box" id="loginForm"><div class="logo">F</div><h1>Finrise Assets</h1><h2>Admin Center</h2><p class="muted">Sign in with your existing Finrise account. Access is granted only to accounts listed in the database admin_roles table.</p><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Sign in securely</button><p id="message" role="status"></p></form><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin/supabase-config.js"></script><script>const client=supabase.createClient(window.FINRISE_SUPABASE_URL,window.FINRISE_SUPABASE_PUBLISHABLE_KEY);document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),m=document.getElementById('message');b.disabled=true;m.textContent='Signing in…';try{const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const {data:role,error:re}=await client.from('admin_roles').select('role').eq('user_id',data.user.id).maybeSingle();if(re||!role){await client.auth.signOut();throw new Error('This account is not authorized as an administrator. Ask an existing project owner to assign your admin role securely.')}location.href='/admin/dashboard.html'}catch(err){m.textContent=err.message||'Unable to sign in.'}finally{b.disabled=false}});</script><script src="/admin/pwa-register.js" defer></script></body></html>
